# Render Blueprint — Hotel Booking Cancellation API (bonus cloud)
# Docs: https://render.com/docs/blueprint-spec
# Do not put secrets here. Fill real public URL in README only after a live deploy.

services:
  - type: web
    name: hotel-cancel-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Render sets PORT; predict.py reads os.environ.get("PORT", "9696").
    # GET /health returns 200; POST /predict is the real API (GET / is still 404).
