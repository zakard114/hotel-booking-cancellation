<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HoldRisk · hotel cancellation risk (DRAFT)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="chrome">
    <div class="draft">DRAFT · 더미 · API 미연결</div>
    <button class="ops" id="ops" type="button" title="Ops placeholder">Ops</button>
  </div>

  <main class="shell">
    <div class="stage">
      <div class="brand-block">
        <h1 class="brand">Hold<span class="brand-accent">Risk</span></h1>
        <p class="lede">예약이 취소될지, 확률 한 장으로 먼저 본다. 리드타임·호텔·보증금·채널만 넣고 점수.</p>
      </div>

      <div class="workspace">
        <form id="form" class="fields" autocomplete="off">
          <div class="field">
            <label for="lead_time">Lead time (days)</label>
            <input id="lead_time" name="lead_time" type="number" min="0" max="700" value="50" required />
          </div>
          <div class="field">
            <label for="hotel">Hotel type</label>
            <select id="hotel" name="hotel">
              <option value="City Hotel" selected>City Hotel</option>
              <option value="Resort Hotel">Resort Hotel</option>
            </select>
          </div>
          <div class="field">
            <label for="deposit">Deposit type</label>
            <select id="deposit" name="deposit">
              <option value="No Deposit" selected>No Deposit</option>
              <option value="Non Refund">Non Refund</option>
              <option value="Refundable">Refundable</option>
            </select>
          </div>
          <div class="field">
            <label for="segment">Market segment</label>
            <select id="segment" name="segment">
              <option value="Online TA" selected>Online TA</option>
              <option value="Offline TA/TO">Offline TA/TO</option>
              <option value="Direct">Direct</option>
              <option value="Groups">Groups</option>
              <option value="Corporate">Corporate</option>
              <option value="Complementary">Complementary</option>
            </select>
          </div>
          <div class="field">
            <label for="adults">Adults</label>
            <input id="adults" name="adults" type="number" min="1" max="10" value="2" />
          </div>
          <div class="field">
            <label for="adr">ADR</label>
            <input id="adr" name="adr" type="number" min="0" step="1" value="100" />
          </div>
          <div class="cta-row">
            <button class="predict" id="predict" type="submit">Predict cancel risk</button>
            <button class="reset" id="reset" type="button">Reset</button>
          </div>
        </form>

        <aside class="result" id="result" aria-live="polite">
          <p class="result-kicker">Cancel probability · mock</p>
          <p class="prob" id="prob">—</p>
          <div class="meter" aria-hidden="true"><span id="meter-fill"></span></div>
          <p class="verdict" id="verdict">값을 넣고 예측을 누르면 취소 확률과 <strong>is_canceled</strong>가 여기에 뜹니다.</p>
          <p class="hint">더미 점수입니다. 학습된 모델·API와는 아직 연결되지 않았습니다.</p>
        </aside>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status">Ops는 나중에 — 지금은 자리만</div>
  <script src="./app.js"></script>
</body>
</html>
